services:
  bot:
    build:
      context: .
    container_name: discord-ai-chat
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./runtime/bot.env
    environment:
      NODE_ENV: production
      BOT_CONFIG: /app/runtime/bot.yaml
      BOT_DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - ./runtime/bot.yaml:/app/runtime/bot.yaml:ro
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
