use_default_settings: true

general:
  instance_name: Discord AI Search

search:
  safe_search: 1
  autocomplete: ''
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: 'replace-on-server-with-random-secret'

ui:
  static_use_hash: true

redis:
  url: false
