name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Test deployment controller
        run: python3 -m unittest discover -s test -p '*_test.py' -v
      - name: Build production image
        run: docker build --tag discord-ai-chat-ci .
      - name: Check production dependencies offline
        run: >-
          docker run --rm --network none
          --env BOT_DATABASE_PATH=/tmp/ci.sqlite3
          discord-ai-chat-ci node scripts/doctor.js --offline
