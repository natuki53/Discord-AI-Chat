schemaVersion: 1
timezone: Asia/Tokyo

discord:
  guildId: '000000000000000000'
  adminRoleIds: []
  channels:
    - id: '000000000000000001'
      mode: all
      debounceMs: 2500
      maxDebounceMs: 8000
      sessionIdleMinutes: 15

persona:
  name: Discord AI Chat
  identity: >-
    あなたはDiscordの会話へ自然に参加するAIです。AIであることを隠さず、
    日本語で短く親しみやすく話します。
  style: >-
    通常は1〜3文で返し、現在の会話のネタやツッコミには自然に乗ってください。
    個人攻撃や嫌がらせには加勢せず、不確かな事実を断定しないでください。

llm:
  baseUrl: http://127.0.0.1:11434
  model: qwen3.5:9b
  contextTokens: 8192
  maxOutputTokens: 1024
  timeoutMs: 60000
  temperature: 0.75
  keepAlive: 15m

web:
  enabled: true
  provider: searxng
  baseUrl: http://127.0.0.1:8888
  timeoutMs: 10000
  maxResults: 5
  maxFetchesPerTurn: 2
  maxBytesPerPage: 1048576

privacy:
  messageRetentionHours: 24
  sessionSummaryRetentionHours: 24
  operationalRetentionDays: 30

conversation:
  recentMessageLimit: 60
  summaryEveryMessages: 12
  semanticTopicBoundaries: true
  topicBoundaryConfidence: 0.8
  topicBoundaryLookbackMessages: 12
  maxResponseCharacters: 1800
  globalConcurrency: 1
